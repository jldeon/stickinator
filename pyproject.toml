[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stickinator"
version = "0.1.0"
description = "Turn images into printable, cut-ready stickers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.12,<6.13",
    "numpy>=2.3,<3",
    "opencv-python-headless>=4.14,<5",
    "Pillow>=12.3,<14",
    "httpx>=0.28,<1",
    "keyring>=25.7,<26",
    "rembg>=2.0.87,<3",
    "onnxruntime>=1.32,<2",
]

[project.scripts]
stickinator = "stickinator.app:main"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pyinstaller>=6.22",
    "pytest>=8.4",
    "pytest-qt>=4.5",
    "pytest-timeout>=2.4",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stickinator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PTH", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["stickinator"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2.*", "onnxruntime.*", "pymatting.*", "rembg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "network: downloads models or calls remote services; skipped in CI",
]
qt_api = "pyside6"
